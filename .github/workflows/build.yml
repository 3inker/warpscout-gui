name: Build WarpScout

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build
        working-directory: gui
        run: wails build -platform windows/amd64 -clean

      - name: Rename binary
        working-directory: gui/build/bin
        shell: bash
        run: mv WarpScoutGUI.exe WarpScoutGUI-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarpScout-windows
          path: gui/build/bin/WarpScoutGUI-windows.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: .github/RELEASE_NOTES.md