name: Build WarpScout

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Update Version Info
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not $version) { $version = "0.0.0" }
          
          $infoFile = "gui/build/windows/info.json"
          if (Test-Path $infoFile) {
              $info = Get-Content $infoFile -Raw | ConvertFrom-Json
              $info.fixed.file_version = "$version.0"
              $info.info.0000.ProductVersion = "$version.0"
              $info | ConvertTo-Json -Depth 10 | Set-Content $infoFile
          }

      - name: Build
        working-directory: gui
        run: wails build -platform windows/amd64 -clean -ldflags "-X main.CurrentVersion=${{ github.ref_name }}"

      - name: Rename binary
        working-directory: gui/build/bin
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          mv WarpScoutGUI.exe "WarpScoutGUI-windows-${VERSION}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarpScout-windows
          path: gui/build/bin/WarpScoutGUI-windows-*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true